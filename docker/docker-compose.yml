# Self-hosted deployment target, alternative to infra/ (AWS ECS Fargate).
# See README.md for the security tradeoff of mounting the Docker socket here.
services:
  waterdogpe:
    build: ../waterdog
    container_name: waterdogpe
    environment:
      PROVISIONER: docker
      DOCKER_NETWORK: bdsnet
      # A HOST path, not a path inside this container: DockerWorldProvisioner
      # passes it straight to `docker run -v`, which the host's Docker daemon
      # resolves - not this container's own filesystem (Docker-outside-of-
      # Docker via the mounted socket below). ${PWD} is this host directory
      # (docker/), assuming `docker compose` is run from here.
      DOCKER_DATA_DIR: ${PWD}/data/worlds
      # Whether to re-register/re-provision worlds added via POST /worlds on
      # startup. Set to "false" to leave previously added worlds stopped
      # until POST /worlds is called for them again. lobby always starts
      # regardless of this setting - see WorldControlPlugin.
      RECONCILE: ${RECONCILE:-true}
      # Optional: a HOST path (see the DOCKER_DATA_DIR comment above - same
      # Docker-outside-of-Docker resolution) with behavior packs/config
      # shared by every world this provisions, lobby included. See ./shared.
      DOCKER_SHARED_DIR: ${PWD}/shared
      # Optional: lobby's gamemode/worldType, default survival/normal - see
      # WorldControlPlugin.bootstrapWorlds. Set LOBBY_WORLD_TYPE=void (with a
      # matching ./world-templates/void, see below) if lobby's behavior pack
      # needs Script API modules that require Beta APIs, which a freshly
      # generated world doesn't have enabled.
      LOBBY_GAMEMODE: ${LOBBY_GAMEMODE:-survival}
      LOBBY_WORLD_TYPE: ${LOBBY_WORLD_TYPE:-normal}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.yml:/waterdog/config.yml
      # DockerWorldProvisioner's own record of worlds added via POST /worlds
      # (name -> gamemode), read back on startup to re-register and, if the
      # container is gone, re-provision them - see WorldControlPlugin.
      - ./data/state:/waterdog/state
      # Pre-built world docker cp'd into a new world's data dir when
      # worldType=void is requested - see DockerWorldProvisioner.
      - ./world-templates:/waterdog/world-templates:ro
      # Read-only view of ./shared, used only to enumerate behavior pack
      # names - DockerWorldProvisioner mounts the packs themselves into each
      # world via the host path in DOCKER_SHARED_DIR above, not this one.
      - ./shared:/waterdog/shared:ro
    ports:
      - "19132:19132/udp"
      # No authentication of its own - loopback-only, never published beyond
      # this host. See README for the same reasoning as the ECS "control"
      # security group.
      - "127.0.0.1:8081:8081"
    networks:
      - bdsnet
    restart: unless-stopped

networks:
  bdsnet:
    name: bdsnet
    driver: bridge
