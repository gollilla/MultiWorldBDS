services:
  bds:
    platform: linux/amd64
    image: itzg/minecraft-bedrock-server
    ports:
      - "${SERVER_PORT:-19132}:19132/udp"
      - "${SCRIPT_DEBUGGER_PORT:-19144}:19144"
      - "${SCRIPT_DEBUGGER_PORT:-19144}:19144/udp"
    volumes:
      - "./dist/behavior_pack:/data/behavior_packs/BP"
      - "./resource_pack_dev:/data/resource_packs/RP"
      - "./worlds:/data/worlds"
      - "./config:/data/config"
    environment:
      - SERVER_NAME=${SERVER_NAME:-hakomc-server}
      - DEFAULT_PLAYER_PERMISSION_LEVEL=operator
      - EULA=TRUE
      # Without this, BDS defaults to NetherNet and binds IPv6-only ("Accepting
      # clients on [::]:<port>" in the logs) - unreachable from a plain RakNet
      # connection (i.e. a normal Bedrock client's "Add Server" over IPv4).
      - TRANSPORT=raknet
      - ONLINE_MODE=true
      - ALLOW_LIST=false
      - LEVEL_NAME=DevWorld
      - LEVEL_TYPE=flat
      - GAMEMODE=creative
      - DEFAULT_PLAYER_PERMISSION_LEVEL=operator
      - ALLOW_CHEATS=true
      - ALLOW_OUTBOUND_SCRIPT_DEBUGGING=true
      - ALLOW_INBOUND_SCRIPT_DEBUGGING=true
      - SCRIPT_DEBUGGER_AUTO_ATTACH=listen
      - CONTENT_LOG_CONSOLE_OUTPUT_ENABLED=true
      - FORCE_INBOUND_DEBUG_PORT=${SCRIPT_DEBUGGER_PORT:-19144}
      - OPS=${OPS}
      # Writes config/default/variables.json for @minecraft/server-admin - see
      # examples/worldControlCommands.ts. Points at the WorldControl API of the
      # docker/ WaterdogPE stack (127.0.0.1:8081 on the host, hence
      # host.docker.internal - this container and that stack are two separate
      # Compose projects, not on the same Docker network).
      - VARIABLES=worldControlApiUrl=http://host.docker.internal:8081
    extra_hosts:
      # host.docker.internal isn't automatic on Linux like it is with Docker
      # Desktop; host-gateway makes it resolve to the host here too.
      - "host.docker.internal:host-gateway"
    depends_on:
      dev:
        condition: service_completed_successfully
  dev:
    image: node:23.11.1-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ".:/app"
    tmpfs:
      - /tmp
    entrypoint: sh -c "npm install && npm run build:app"
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_CACHE=/tmp/.npm
